<title>Card Sheet Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* One deliberate look: the game's dark table, gilt edges, parchment text box. */
:root {
  color-scheme: dark;
  --ground: #120c18; --panel: #1b1325; --panel-2: #231a30; --line: #3a2c48;
  --ink: #efe6d6; --muted: #a898b4; --gilt: #d9ac55; --gilt-dim: #d9ac5555;
  --ok: #6cc38f; --flag: #e0785a; --warn: #e6c25a;
  --t-group: #9b6ad8; --t-plot: #c9485b; --t-resource: #3fa7a0; --t-illuminati: #d9ac55;
  --parch: #efe2c4; --parch-ink: #2a2117;
  --display: 'Cormorant SC', 'Cormorant Garamond', Georgia, serif;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --body: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
body { background: var(--ground); color: var(--ink); font: 14px/1.5 var(--body); padding-inline: 16px; padding-block: 16px 32px; }
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gilt); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 14px; }
.top h1 { font: 700 26px/1.1 var(--display); letter-spacing: .04em; margin: 0; color: var(--gilt); text-wrap: balance; }
.top p { margin: 0; color: var(--muted); max-width: 70ch; }
.progress { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.bar { width: 180px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .a { background: var(--ok); } .bar .f { background: var(--flag); }
.store-note { font-size: 12px; color: var(--warn); }

.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* Card list */
.side { position: sticky; top: env(safe-area-inset-top, 0px); display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 32px); }
@media (max-width: 900px) { .side { position: static; max-height: none; } .list { max-height: 240px; } }
.side input { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
.chip.on { border-color: var(--gilt); color: var(--gilt); }
.list { overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-height: 120px; }
.item { display: grid; grid-template-columns: 34px 1fr 10px; gap: 6px; align-items: center; width: 100%; border: 0; border-bottom: 1px solid #2a2036; background: none; padding: 6px 10px; text-align: left; font-size: 13px; }
.item:hover { background: var(--panel-2); }
.item.cur { background: #2e2240; box-shadow: inset 3px 0 0 var(--gilt); }
.item .n { font: 500 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.item .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.approved { background: var(--ok); } .dot.flagged { background: var(--flag); } .dot.attention { background: var(--warn); }

/* Main: card and sheet side by side */
.main { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1100px) { .main { grid-template-columns: minmax(0, 1fr); } .card-wrap { max-width: 360px; margin-inline: auto; width: 100%; } }
.nav { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
.nav button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 12px; }
.nav .where { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.nav .keys { margin-left: auto; color: var(--muted); font-size: 12px; }
@media (max-width: 600px) { .nav .keys { display: none; } }

/* The card mock-up: real 5×7 shape, arrows on its edges like the table cards. */
.card-wrap { position: relative; padding: 12px; }
.card { --tc: var(--t-group); position: relative; aspect-ratio: 5 / 7; max-width: 100%; border-radius: 16px; padding: 10px;
  background: linear-gradient(160deg, #2a1d38, #150e1d); border: 2px solid var(--gilt);
  box-shadow: 0 0 0 4px #150e1d, 0 0 0 5px var(--gilt-dim), 0 18px 40px #000a; display: flex; flex-direction: column; gap: 8px; }
.card.Plot { --tc: var(--t-plot); } .card.Resource { --tc: var(--t-resource); } .card.Illuminati { --tc: var(--t-illuminati); }
.c-head { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; border-bottom: 1px solid var(--gilt-dim); padding-bottom: 6px; }
.c-head svg { width: 30px; height: 30px; }
.c-name { font: 700 clamp(17px, 4.6vw, 23px)/1.05 var(--display); color: #f5d98f; text-wrap: balance; }
.c-type { font: 600 10.5px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--tc); border: 1px solid var(--tc); border-radius: 4px; padding: 1px 6px; text-align: center; }
.c-type small { display: block; letter-spacing: .06em; color: var(--muted); font-size: 9.5px; text-transform: none; }
.c-art { flex: 1 1 0; min-height: 0; border-radius: 8px; border: 1px dashed var(--gilt-dim); background: radial-gradient(ellipse at 50% 40%, #2d2040, #120c18); display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 10px 14px; text-align: center; overflow: hidden; }
.c-art b { font: 600 10px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--gilt); }
.c-art span { font: italic 500 13.5px/1.35 var(--serif); color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
.c-text { background: var(--parch); color: var(--parch-ink); border-radius: 8px; padding: 9px 12px; font: 600 14px/1.3 var(--serif); text-align: center; box-shadow: inset 0 0 12px #8a6a3044; }
.c-text .fl { font-style: italic; font-weight: 500; color: #5a2e6e; border-top: 1px solid #8a6a3066; margin-top: 6px; padding-top: 5px; font-size: 13.5px; }
.c-stats { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; }
.stat { border: 1px solid var(--gilt-dim); border-radius: 6px; background: #150e1d; text-align: center; padding: 3px 2px 4px; }
.stat b { display: block; font: 600 9px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stat span { font: 700 22px/1.1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.stat span.al { font: 600 12px/1.2 var(--serif); color: #cfa9f0; display: block; padding-top: 2px; }
.arr { position: absolute; width: 0; height: 0; border: 9px solid transparent; }
.arr.out.N { top: -8px; left: calc(50% - 9px); border-bottom-color: var(--gilt); border-top: 0; }
.arr.out.S { bottom: -8px; left: calc(50% - 9px); border-top-color: var(--gilt); border-bottom: 0; }
.arr.out.E { right: -8px; top: calc(50% - 9px); border-left-color: var(--gilt); border-right: 0; }
.arr.out.W { left: -8px; top: calc(50% - 9px); border-right-color: var(--gilt); border-left: 0; }
.arr.in { border-width: 7px; }
.arr.in.N { top: 14px; left: calc(50% - 7px); border-top-color: var(--muted); }
.arr.in.S { bottom: 14px; left: calc(50% - 7px); border-bottom-color: var(--muted); }
.arr.in.E { right: 14px; top: calc(50% - 7px); border-right-color: var(--muted); }
.arr.in.W { left: 14px; top: calc(50% - 7px); border-left-color: var(--muted); }

/* The info sheet */
.sheet { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
.sheet table { width: 100%; border-collapse: collapse; }
.sheet th { width: 150px; text-align: left; vertical-align: top; font: 600 12.5px var(--body); color: #d9c9ec; background: #241733; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.sheet td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.sheet td.fl { font: italic 500 15px/1.4 var(--serif); }
.sheet td.mono { font-family: var(--mono); font-size: 12.5px; color: var(--gilt); word-break: break-all; }
.sheet ul { margin: 0; padding-left: 18px; }
.pass { color: var(--ok); } .bad { color: var(--flag); }
.alt-head th { background: #2c1f3c; color: var(--gilt); letter-spacing: .08em; text-transform: uppercase; font-size: 11.5px; }
@media (max-width: 600px) { .sheet th { width: 104px; padding: 7px 8px; } .sheet td { padding: 7px 8px; } }

.review { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: #1f152b; }
.review .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.review textarea { width: 100%; min-height: 64px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); padding: 8px 10px; resize: vertical; }
.btn { border-radius: 8px; padding: 7px 16px; font-weight: 600; border: 1px solid; background: none; }
.btn.ok { border-color: var(--ok); color: var(--ok); } .btn.ok.on { background: var(--ok); color: #0f1a13; }
.btn.fl { border-color: var(--flag); color: var(--flag); } .btn.fl.on { background: var(--flag); color: #1f0f09; }
.btn.clear { border-color: var(--line); color: var(--muted); font-weight: 400; }
.saved { font-size: 12.5px; color: var(--muted); }
.empty { padding: 30px; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .2s ease; } }
</style>

<header class="top">
  <h1>Card Sheet Review</h1>
  <p>Every card's new text, flavour and notes, drafted one card at a time and checked against the original wording. Where the GPT workbook has a version too, it is shown underneath to compare. Nothing here is in the game until you approve it.</p>
  <div class="progress" id="progress"></div>
</header>
<div class="layout">
  <aside class="side">
    <input id="q" type="search" placeholder="Search cards" aria-label="Search cards">
    <div class="chips" id="filters"></div>
    <div class="chips" id="types"></div>
    <div class="list" id="list" role="listbox" aria-label="Cards"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
const SHEETS = /*SHEETS*/[];
const EYE = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4L37 34H3Z" fill="#150e1d" stroke="#d9ac55" stroke-width="2.4" stroke-linejoin="round"/><path d="M11 24Q20 15 29 24Q20 32 11 24Z" fill="#2a1a10" stroke="#d9ac55" stroke-width="1.6"/><circle cx="20" cy="24" r="3.6" fill="#d9ac55"/><circle cx="20" cy="24" r="1.5" fill="#120a06"/></svg>';
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const state = { i: 0, filter: 'all', type: 'all', q: '', reviews: {}, db: null, local: false };
try { const v = JSON.parse(localStorage.getItem('card-review.pos') || '{}'); if (typeof v.i === 'number') state.i = v.i; } catch (e) {}

const statusOf = (s) => { const v = state.reviews[s.id]?.status; return v === 'second' ? 'approved' : v || (s.status === 'Needs attention' ? 'attention' : 'todo'); };
function visible() {
  const q = state.q.toLowerCase();
  return SHEETS.map((s, i) => ({ s, i })).filter(({ s }) =>
    (state.type === 'all' || s.type === state.type) &&
    (state.filter === 'all' || statusOf(s) === state.filter) &&
    (!q || (s.name + ' ' + (s.cardText || '') + ' ' + (s.flavorText || '')).toLowerCase().includes(q)));
}

function renderTop() {
  const n = SHEETS.length, a = SHEETS.filter((s) => statusOf(s) === 'approved').length, f = SHEETS.filter((s) => statusOf(s) === 'flagged').length;
  document.getElementById('progress').innerHTML = `<span class="bar"><i class="a" style="width:${n ? a / n * 100 : 0}%"></i><i class="f" style="width:${n ? f / n * 100 : 0}%"></i></span>
    <span>${a} approved · ${f} flagged · ${n - a - f} to review · ${n} of 412 drafted</span>
    ${state.local ? '<span class="store-note">Reviews are saving in this browser only.</span>' : ''}`;
  const F = [['all', 'All'], ['todo', 'To review'], ['approved', 'Approved'], ['flagged', 'Flagged'], ['attention', 'Needs attention']];
  document.getElementById('filters').innerHTML = F.map(([k, l]) => `<button class="chip ${state.filter === k ? 'on' : ''}" data-f="${k}">${l}</button>`).join('');
  const T = ['all', 'Illuminati', 'Group', 'Resource', 'Plot'];
  document.getElementById('types').innerHTML = T.map((k) => `<button class="chip ${state.type === k ? 'on' : ''}" data-t="${k}">${k === 'all' ? 'Every type' : k + 's'}</button>`).join('');
}

function renderList() {
  const v = visible();
  document.getElementById('list').innerHTML = v.map(({ s, i }) => `<button class="item ${i === state.i ? 'cur' : ''}" data-i="${i}" role="option" aria-selected="${i === state.i}">
    <span class="n">${String(s.number).padStart(3, '0')}</span><span class="nm">${esc(s.name)}</span><span class="dot ${statusOf(s)}" title="${statusOf(s)}"></span></button>`).join('') || '<div class="empty">No cards match.</div>';
  document.querySelector('.item.cur')?.scrollIntoView({ block: 'nearest' });
}

function cardHtml(s) {
  const arrows = s.arrows ? [...(s.arrows.out || []).map((d) => `<i class="arr out ${d}"></i>`), s.arrows.in ? `<i class="arr in ${s.arrows.in}"></i>` : ''].join('') : '';
  const stat = (l, v, cls = '') => `<div class="stat"><b>${l}</b><span class="${cls}">${esc(v)}</span></div>`;
  let stats = '';
  if (s.type === 'Group') stats = stat('Power', s.power ?? '–') + stat('Global', s.globalPower ?? '–') + stat('Resist', s.resistance ?? '–') + stat('Alignment', (s.alignments || []).join(' ') || 'None', 'al');
  else if (s.type === 'Illuminati') stats = stat('Power', s.power ?? '–') + stat('Global', s.globalPower ?? '–');
  else if (s.type === 'Resource' && (s.power != null || s.resistance != null)) stats = stat('Power', s.power ?? '–') + stat('Resist', s.resistance ?? '–');
  const sub = s.subtype && s.subtype !== s.type ? s.subtype : '';
  return `<div class="card-wrap"><div class="card ${esc(s.type)}">${arrows}
    <div class="c-head">${EYE}<div class="c-name">${esc(s.name)}</div><div class="c-type">${esc(s.type)}${sub ? `<small>${esc(sub)}</small>` : ''}</div></div>
    <div class="c-art"><b>Art to come</b><span>${esc(s.artBrief)}</span></div>
    <div class="c-text">${esc(s.cardText)}${s.flavorText ? `<div class="fl">${esc(s.flavorText)}</div>` : ''}</div>
    ${stats ? `<div class="c-stats">${stats}</div>` : ''}
  </div></div>`;
}

function sheetHtml(s) {
  const r = state.reviews[s.id] || {};
  const arrows = s.arrows ? `In ${s.arrows.in || '–'} · Out ${(s.arrows.out || []).join(', ') || 'none'}` : '—';
  const rows = [
    ['Card #', s.number], ['Card name', s.name], ['Type', [s.type, s.subtype && s.subtype !== s.type ? s.subtype : ''].filter(Boolean).join(' · ')],
    ['Alignment(s)', (s.alignments || []).join(', ') || 'None'], ['Attributes', (s.attributes || []).join(', ') || 'None'], ['Arrows', arrows],
    ['Power', s.power ?? '—'], ['Global Power', s.globalPower ?? '—'], ['Resistance', s.resistance ?? '—'],
  ].filter(([k, v]) => !(v === '—' && ['Arrows', 'Power', 'Global Power', 'Resistance'].includes(k)) && !(v === 'None' && s.type === 'Plot'))
   .map(([k, v]) => `<tr><th>${k}</th><td>${esc(v)}</td></tr>`).join('');
  const inter = Array.isArray(s.interactions) ? `<ul>${s.interactions.map((x) => `<li>${esc(typeof x === 'string' ? x : JSON.stringify(x))}</li>`).join('')}</ul>` : esc(s.interactions);
  const orig = String(s.originality || '');
  return `<section class="sheet" aria-label="Info sheet for ${esc(s.name)}"><table>${rows}
    <tr><th>Card text (new)</th><td>${esc(s.cardText)}</td></tr>
    <tr><th>Flavour text (new)</th><td class="fl">${esc(s.flavorText)}</td></tr>
    <tr><th>Special notes</th><td>${esc(s.specialNotes)}</td></tr>
    <tr><th>Interactions</th><td>${inter}</td></tr>
    <tr><th>Prerequisites</th><td>${esc(s.prerequisites)}</td></tr>
    <tr><th>Art brief</th><td>${esc(s.artBrief)}</td></tr>
    <tr><th>Image file</th><td class="mono">${esc(s.imageFile)}</td></tr>
    <tr><th>Originality check</th><td class="${orig.startsWith('PASS') ? 'pass' : 'bad'}">${esc(orig || 'Not run')}</td></tr>
    <tr><th>Draft status</th><td>${esc(s.status)}</td></tr>
    ${s.second?.cardText ? `<tr class="alt-head"><th colspan="2">Second draft (GPT workbook)</th></tr>
    <tr><th>Card text</th><td>${esc(s.second.cardText)}</td></tr>
    <tr><th>Flavour text</th><td class="fl">${esc(s.second.flavorText)}</td></tr>
    <tr><th>Originality check</th><td class="${String(s.second.check).startsWith('PASS') ? 'pass' : 'bad'}">${esc(s.second.check)}</td></tr>
    ${s.second.photoPrompt ? `<tr><th>Its image prompt</th><td>${esc(s.second.photoPrompt)}</td></tr>` : ''}` : ''}
    <tr><th>Date added</th><td>${esc(s.dateAdded)}</td></tr>
  </table>
  <div class="review">
    <div class="row">
      <button class="btn ok ${r.status === 'approved' ? 'on' : ''}" data-act="approved">Approve</button>
      ${s.second?.cardText && String(s.second.check).startsWith('PASS') ? `<button class="btn ok ${r.status === 'second' ? 'on' : ''}" data-act="second" title="Use the second draft's text and flavour">Use second draft</button>` : ''}
      <button class="btn fl ${r.status === 'flagged' ? 'on' : ''}" data-act="flagged">Flag for changes</button>
      ${r.status ? '<button class="btn clear" data-act="clear">Clear</button>' : ''}
      <span class="saved" id="saved">${r.at ? `${({ approved: 'Approved', second: 'Second draft chosen', flagged: 'Flagged' })[r.status] || ''} ${new Date(r.at).toLocaleString()}` : ''}</span>
    </div>
    <label for="note" class="saved">What should change? (saved with a flag)</label>
    <textarea id="note" placeholder="e.g. Flavour is too long; name the other card it works with">${esc(r.note || '')}</textarea>
  </div></section>`;
}

function renderMain() {
  const s = SHEETS[state.i];
  const main = document.getElementById('main');
  if (!s) { main.innerHTML = '<div class="empty">No card sheets yet.</div>'; return; }
  const v = visible(), pos = v.findIndex((x) => x.i === state.i);
  main.innerHTML = `<div class="nav"><button data-go="-1" aria-label="Previous card">‹ Prev</button><button data-go="1" aria-label="Next card">Next ›</button>
    <span class="where">${pos >= 0 ? `${pos + 1} of ${v.length}` : 'Not in this filter'}</span><span class="keys">← → to move · A approve · F flag</span></div>
    ${cardHtml(s)}${sheetHtml(s)}`;
}

function render() { renderTop(); renderList(); renderMain(); try { localStorage.setItem('card-review.pos', JSON.stringify({ i: state.i })); } catch (e) {} }

function go(d) {
  const v = visible(); if (!v.length) return;
  const pos = v.findIndex((x) => x.i === state.i);
  state.i = v[Math.max(0, Math.min(v.length - 1, (pos < 0 ? 0 : pos + d)))].i; render();
}

async function saveReview(status) {
  const s = SHEETS[state.i]; if (!s) return;
  const note = document.getElementById('note')?.value.trim() || '';
  const rec = status ? { status, note, name: s.name, number: s.number, at: Date.now() } : null;
  if (rec) state.reviews[s.id] = rec; else delete state.reviews[s.id];
  if (state.db) {
    try { rec ? await state.db.collection('reviews').doc(s.id).set(rec) : await state.db.collection('reviews').doc(s.id).delete(); }
    catch (e) { state.local = true; }
  }
  if (!state.db || state.local) { try { localStorage.setItem('card-review.local', JSON.stringify(state.reviews)); } catch (e) {} }
  if (status === 'approved' || status === 'second') go(1); else render();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.i) { state.i = +t.dataset.i; render(); }
  else if (t.dataset.go) go(+t.dataset.go);
  else if (t.dataset.f) { state.filter = t.dataset.f; render(); }
  else if (t.dataset.t) { state.type = t.dataset.t; render(); }
  else if (t.dataset.act) saveReview(t.dataset.act === 'clear' ? null : t.dataset.act);
});
document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; renderList(); });
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'a' || e.key === 'A') saveReview('approved');
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); document.getElementById('note')?.focus(); saveReview('flagged'); }
});

// Reviews are shared: they are kept with the page so Claude can read them back.
try { state.reviews = JSON.parse(localStorage.getItem('card-review.local') || '{}'); } catch (e) {}
if (state.i >= SHEETS.length) state.i = 0;
render();
(async () => {
  const db = await window.claude?.use?.('db').catch(() => null);
  if (!db) { state.local = true; renderTop(); return; }
  state.db = db;
  db.collection('reviews').onSnapshot((snap) => {
    const next = {};
    for (const d of snap.docs) next[d.id] = d.data();
    state.reviews = next; state.local = false;
    const note = document.getElementById('note'), typing = note && document.activeElement === note;
    renderTop(); renderList(); if (!typing) renderMain();
  }, () => { state.local = true; renderTop(); });
})();
</script>
